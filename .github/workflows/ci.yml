name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyse
        run: |
          flutter analyze > analyze.txt 2>&1 || { grep -E '(error|warning|info) ' analyze.txt | head -30 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - run: flutter test
